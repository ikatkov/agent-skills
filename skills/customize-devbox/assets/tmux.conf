# Plugins (managed by tpack)
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "sainnhe/tmux-fzf"

set -g status-right ''
set -g status-left '#H #S '
set -g status-left-length 100
set -g status-justify left

# Enable mouse support
set -g mouse on
bind-key -T copy-mode WheelUpPane   send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 1 scroll-down

# Activity bell and whistles
set -g visual-activity on

# Show titles in pane borders
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically after closing one
set -g renumber-windows on

# Dim inactive panes
set -g window-style 'fg=colour244,bg=colour235'

# Keep active pane normal/bright
set -g window-active-style 'fg=colour252,bg=colour234'

# Optional: make the active border obvious too
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour124'

# Set the parent terminal (iTerm2) tab title. A #() job runs on every status
# redraw (status-interval, and on window/pane switch) and is cached per distinct
# expanded command, so each window/pane gets its own title. See ~/.tmux/bin/title.sh.
# #{q:...} shell-escapes the path (no manual quotes) so a directory name can't
# inject commands into the #() job:
#   <host>  ·  <host> · TICKET  ·  <host> · TICKET · PR #n
set -g set-titles on
set -g set-titles-string "#(~/.tmux/bin/title.sh #{pane_pid} #{q:pane_current_path})"

# Optional: pane titles
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "

# https://gist.github.com/jftuga/ffa03dbf4cd818f00cc32ce4186d6c1c
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Initialize tpack - MUST be the last line of this file.
run "tpack init"
